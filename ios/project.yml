name: ChampionsFootball
options:
  bundleIdPrefix: com.hungki.worldcup
  deploymentTarget:
    iOS: "15.0"
targets:
  ChampionsFootball:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
      - path: ../champions-football.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hungki.worldcup.football
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
