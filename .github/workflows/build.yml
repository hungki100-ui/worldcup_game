          B64DATA
          tar xzf _app.tgz -C _app
          mkdir -p _app/app/src/main/assets
          GAME=$(ls -S ./*.html 2>/dev/null | head -1)
          if [ -z "$GAME" ]; then echo "::error::저장소 맨 위에 게임 html 파일(2026worldcup-game.html)을 올려 주세요"; exit 1; fi
          echo "game file: $GAME"
          cp "$GAME" _app/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle -p _app assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldcup-apk
          path: _app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp _app/app/build/outputs/apk/debug/app-debug.apk 2026worldcup-game.apk
          gh release create "v${{ github.run_number }}" 2026worldcup-game.apk --title "2026worldcup game v${{ github.run_number }}" --notes "설치용 APK" || true
