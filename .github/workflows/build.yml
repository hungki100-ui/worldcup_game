          tar xzf _app.tgz -C _app
          sed -i 's/android:label="2027 챔피언스 풋볼"/android:label="2027 챔피언스 풋볼"/' _app/app/src/main/AndroidManifest.xml
          mkdir -p _app/app/src/main/assets
          GAME=$(ls -S ./*.html 2>/dev/null | head -1)
          if [ -z "$GAME" ]; then echo "::error::저장소 맨 위에 게임 html 파일(champions-football.html)을 올려 주세요"; exit 1; fi
          echo "game file: $GAME"
          cp "$GAME" _app/app/src/main/assets/index.html
          if [ -f icon/ic_launcher.png ]; then rm -f _app/app/src/main/res/drawable/ic_launcher.xml; mkdir -p _app/app/src/main/res/drawable-nodpi; cp icon/ic_launcher.png _app/app/src/main/res/drawable-nodpi/ic_launcher.png; fi
          if [ -d anthem ]; then cp -r anthem _app/app/src/main/assets/anthem; fi
      - name: Build debug APK
        run: gradle -p _app assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: champions-football-apk
          path: _app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp _app/app/build/outputs/apk/debug/app-debug.apk champions-football.apk
          gh release create "v${{ github.run_number }}" champions-football.apk --title "Champions Football v${{ github.run_number }}" --notes "설치용 APK" || true
