name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned Archive
        working-directory: ios
        run: |
          xcodebuild clean archive \
            -project ChampionsFootball.xcodeproj \
            -scheme ChampionsFootball \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ChampionsFootball.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ChampionsFootball.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r ../champions-football.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: champions-football-ipa
          path: ios/build/champions-football.ipa
